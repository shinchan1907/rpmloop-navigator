; RPMLOOP Navigator — Production Hardware Firmware
; Product target (owner decision, FINAL): ESP32-S3 Mini dev board (4 MB
; flash) + generic red 2.8" SPI TFT touch module (ST7789V controller,
; landscape 320x240). The 16 MB custom-PCB target is DROPPED — this 4 MB
; env is the only build target.
[env:esp32s3_production]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = max_app_4MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ 8.3.11
