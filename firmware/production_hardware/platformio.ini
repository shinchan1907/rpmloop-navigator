; RPMLOOP Navigator — Production Hardware Firmware
; Target (bench-verified 2026-10-29): ESP32-S3 Mini dev board +
; generic red 2.8" SPI TFT module (ILI9341, landscape 320x240).
; The custom-PCB build (ESP32-S3-WROOM-1-N16R8) uses the same pin map.
[env:esp32s3_production]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = max_app_4MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    lovyan03/LovyanGFX @ ^1.1.16
    lvgl/lvgl @ 8.3.11
