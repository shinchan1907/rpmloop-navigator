[env:esp32s3_production]
platform = espressif32
board = waveshare_esp32_s3_zero
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    lovyan03/LovyanGFX @ ^1.1.12
